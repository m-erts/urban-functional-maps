# R environment for r/run_lma.R (the Coombes-Bond step), versions used for the published results.
#   conda env create -f r/environment-r.yml && conda activate omfm-r
#   Rscript -e 'install.packages("LabourMarketAreas", repos = "https://cloud.r-project.org")'   # 3.4
name: omfm-r
channels: [conda-forge]
dependencies:
  - r-base=4.5.3
  - r-data.table=1.18.6.1
  - r-sf=1.1_3
  - r-sp=2.2_3
  - r-spdep=1.4_2
  - r-tmap=4.4_1
