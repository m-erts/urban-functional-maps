name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      # unit tests and the regression snapshot; tests that need raw data skip themselves
      - run: pytest -q
      - name: CITATION.cff is valid
        run: pip install cffconvert && cffconvert --validate
