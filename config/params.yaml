# Single source of parameters. Nothing numeric is hard-coded in src/.
# Values are the ones used for the FOSS4G 2026 talk unless a comment says otherwise.

project:
  seed: 0                       # numpy default_rng seed of every stochastic step
  crs_storage: "EPSG:4326"

paths:                          # relative to the repository root
  raw: data/raw
  interim: data/interim
  processed: data/processed
  tables: outputs/tables
  figures: docs/figures
  maps: outputs/maps

uk:
  crs: "EPSG:27700"
  od_2021:
    file: GB/odwp01ew.zip
    member: ODWP01EW_MSOA.csv
    member_lad: ODWP01EW_LTLA.csv
    # Place of work indicator: -8 does not apply; 1 mainly at/from home or no fixed place
    # (coded workplace = residence); 2 offshore / outside UK; 3 fixed workplace in the UK.
    keep_indicator: [3]
    naive_indicator: [1, 3]     # what a reader who skips the code list keeps
  od_2011:
    file: GB/wu01ew_msoa.zip
    member: wu01ew_msoa.csv
    special_codes:
      OD0000001: "mainly at or from home"
      OD0000002: "offshore installation"
      OD0000003: "no fixed place"
      OD0000004: "outside the UK"
  unit_prefixes: ["E02", "W02"]   # MSOAs of England and Wales
  boundaries_2021: GB/MSOA_2021_EW_BGC_V3.geojson
  boundaries_2011: GB/MSOA_2011_EW_BGC_V3.geojson
  ttwa_2011: GB/TTWA_2011_UK_SGCB.geojson
  lookup_lsoa11_ttwa11: GB/LSOA11_TTWA11_UK_LU.json
  lookup_oa11_msoa11: GB/OA11_LSOA11_MSOA11_LAD11_EW_LU.json
  lookup_oa21_ttwa11: GB/OA21_TTWA11_LAD22_EW_LU.json
  lookup_oa21_msoa21: GB/OA21_LSOA21_MSOA21_EW_LU.json
  delimitation:
    core_quantile: 0.95
    min_job_ratio: 1.0
    merge_threshold: 0.10
    attach_threshold: 0.15
  delimitation_lad:             # district-level run for the scale comparison
    core_quantile: 0.85
    min_job_ratio: 1.0
    merge_threshold: 0.10
    attach_threshold: 0.15
  null_model:
    runs: 60                    # as on stage
    runs_paper: 1000            # for the interval reported in the paper
    runs_contiguous: 300        # random contiguous partitions (zoning effect)
  sweep:                        # iso-count experiment, see pipeline.uk_sweep
    core_quantile: [0.85, 0.875, 0.90, 0.925, 0.95, 0.96, 0.97, 0.98]
    merge_threshold: [0.03, 0.04, 0.05, 0.06, 0.07, 0.08, 0.09, 0.10, 0.12, 0.14, 0.16, 0.18, 0.20, 0.25, 0.30]
    attach_threshold: [0.10, 0.15, 0.20]
    target_areas: 235
    target_tolerance: 12

serbia:
  crs: "EPSG:32634"
  work: "RS/dnevne_migracije_aktivnog_stanovnistva_koje_obavlja_zanimanje_po_polu_i_tipu_naselja.xlsx"
  education: "RS/dnevne_migracije_učenika_i_studenata_po_polu_i_tipu_naselja.xlsx"
  boundaries: RS/opstine_geosrbija_shp.zip
  boundaries_member: Op_tina.shp
  n_municipalities: 168
  republic_total_work: 795779
  pass_thresholds: [0.66, 0.75]
  max_polygon_km2_for_urban_municipality: 400   # regression guard for the mis-joined polygon
  ghsl:
    pop: GHSL/GHS_POP_E2030_GLOBE_R2023A_54009_100_V1_0_R4_C20.zip
    smod: GHSL/GHS_SMOD_E2030_GLOBE_R2023A_54009_1000_V2_0.zip
    urban_classes: [30, 23, 22, 21]
    city_classes: [30]

netherlands:
  table_2014: "81252NED"
  odata: "https://opendata.cbs.nl/ODataApi/odata"
  period: "2014MM12"
  sex: "1100"                   # Totaal mannen en vrouwen
  age: "10000"                  # all ages
  pass_threshold: 0.75
  cache: nl_corop_od_2014.csv   # under paths.interim
  named_regions: {delfzijl: CR02, zeeuwsch_vlaanderen: CR31}   # regions named on stage
  delimitation:
    core_quantile: 0.85
    min_job_ratio: 1.0
    merge_threshold: 0.10
    attach_threshold: 0.15
  crs: "EPSG:28992"
  municipal:                    # successor table with municipal pairs
    table: "85481NED"
    period: "2023MM12"
    cache: nl_gm_od_2023.csv    # under paths.interim
    pdok: "https://api.pdok.nl/cbs/gebiedsindelingen/ogc/v1"
    year: 2023

spain:
  days: ["20231017", "20231018", "20231019", "20231024", "20231025"]   # 26 October 2023 is not published
  districts: ES/zonificacion_distritos/zonificacion_distritos.shp
  names: ES/zonificacion_distritos/nombres_distritos.csv
  crs: "EPSG:3042"              # ETRS89 / UTM 30N, as published
  study: "no"                   # keep destinations that are not a possible place of study

lma:                            # Coombes-Bond parameters of the official Travel to Work Areas 2011
  min_size: 3500
  min_sc: 0.667
  target_size: 25000
  target_sc: 0.75

recom:                          # recombination chain for the contiguous null
  steps: 200000
  burn_in: 100000
  every: 1000
  tolerance: 0.05

japan:
  prefecture: 34                # Hiroshima
  mesh: JP/monthly_mdp_mesh1km_34.zip
  fromto: JP/monthly_fromto_city_34.zip
  attribute: JP/attribute.zip
  attribute_member: attribute/attribute_mesh1km_2019.csv.zip
  city_master: JP/prefcodecitycodemaster.zip
  central_ward: 34101           # Naka-ku, Hiroshima
  city_codes: [34101, 34102, 34103, 34104, 34105, 34106, 34107, 34108]   # wards of Hiroshima city
  daynight: {year: 2019, month: 10, dayflag: 1}
  suppression_below: 10
  map_window: [132.15, 132.85, 34.20, 34.62]        # lon_min, lon_max, lat_min, lat_max
  city_window: [132.28, 132.62, 34.30, 34.48]
  signatures:
    year: 2019
    threshold_ratio: 1.5
    min_people_per_cell: 100
    precedence: [office, leisure, residential]   # first rule that fires wins
    threshold_sweep: [1.25, 1.5, 1.75, 2.0]
  hdbscan:
    min_cluster_size: [20, 40, 60, 80]
    min_samples: [5, 10, 15]
  kmeans_k: [2, 3, 4, 5, 6]

osm_traces:
  api: "https://api.openstreetmap.org/api/0.6/trackpoints"
  points_per_page: 5000
  pages_per_box: 40             # 40 x 5,000 = 200,000 points is a download cap, not a property of the city
  h3_resolution: 8
  windows:                      # lon_min, lat_min, lon_max, lat_max
    hiroshima_centre: [132.440, 34.380, 132.475, 34.405]
    belgrade_centre: [20.440, 44.800, 20.480, 44.825]
    london_soho: [-0.150, 51.505, -0.115, 51.525]

overture:
  release: "2026-07-22.0"
  s3_base: "s3://overturemaps-us-west-2/release"
  s3_region: "us-west-2"
  h3_resolution: 8
  taxonomy_level: 1
  min_poi_per_cell: 10
  flag_top_share: 0.5
  cities:                       # lat_min, lon_min, lat_max, lon_max
    hiroshima: [34.30, 132.35, 34.48, 132.55]
    belgrade: [44.72, 20.35, 44.87, 20.55]
    amsterdam: [52.30, 4.80, 52.42, 5.00]
    london: [51.44, -0.22, 51.56, -0.02]
  cached: {hiroshima: data/derived/overture/hiroshima_dna.parquet, belgrade: data/derived/overture/belgrade_dna.parquet}   # relative to the repository root
