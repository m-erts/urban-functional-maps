[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omfm"
version = "0.1.0.dev0"
description = "Open mobility data for urban function maps: census OD, OSM traces, MNO/app people-flow — reproducible comparison"
authors = [{name = "Marija Ercegovac"}]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["pandas", "numpy", "pyyaml", "geopandas", "shapely", "pyproj", "h3>=4", "duckdb",
                "scikit-learn", "hdbscan", "scipy", "matplotlib", "requests", "gpxpy", "libpysal", "sqlalchemy", "psycopg2-binary"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "markitdown[pptx]", "python-pptx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
