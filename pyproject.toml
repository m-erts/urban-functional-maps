[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omfm"
version = "1.0.0"
description = "Open mobility data for functional-area maps: what each source leaves out, and four tests that show it"
readme = "README.md"
authors = [{name = "Marija Ercegovac"}]
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["functional urban areas", "travel-to-work areas", "MAUP", "commuting", "census", "OpenStreetMap",
            "mobility data", "reproducibility"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: GIS",
]
# Compatible-release pins of the versions the published numbers were produced with.
# Exact pins: environment.yml (conda-forge) and requirements.lock (pip).
dependencies = [
    "numpy~=2.3.5",
    "pandas~=2.3.3",
    "pyarrow>=21,<23",
    "pyyaml~=6.0",
    "requests~=2.32",
    "openpyxl~=3.1",
    "scipy~=1.16.3",
    "scikit-learn~=1.7.2",
    "networkx~=3.5",
    "shapely~=2.1.2",
    "pyproj~=3.7.2",
    "pyogrio~=0.13.0",
    "geopandas~=1.1.4",
    "libpysal~=4.15.0",
    "rasterio~=1.5.1",
    "h3~=4.5",
    "duckdb~=1.5.5",
    "matplotlib~=3.10.6",
]

[project.optional-dependencies]
dev = ["pytest~=8.4", "ruff==0.16.9", "cffconvert==2.0.0"]
postgis = ["sqlalchemy>=2", "geoalchemy2>=0.15", "psycopg2-binary>=2.9"]

[project.urls]
Repository = "https://github.com/m-erts/urban-functional-maps"
Slides = "https://m-erts.github.io/urban-functional-maps/slides/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E731", "B905"]
